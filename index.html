<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claire — Assistante du cabinet dentaire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter+Tight:wght@300;400;500;600&display=swap">
<style>
:root{
--forest:#1f3d35;
--forest-deep:#15291f;
--cream:#f5f0e8;
--cream-warm:#ede5d3;
--charcoal:#1a1a1a;
--slate:#4a4a4a;
--gold:#c4945a;
--serif:'Fraunces',Georgia,serif;
--sans:'Inter Tight',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:var(--sans);
background:var(--cream);
color:var(--charcoal);
line-height:1.5;
}
.container{max-width:1180px;margin:0 auto;padding:0 32px}
a{color:inherit;text-decoration:none}
.hero{padding:140px 0 60px;text-align:center;background:var(--cream)}
.hero h1{
font-family:var(--serif);
font-size:clamp(36px,5vw,52px);
font-weight:500;
line-height:1.1;
letter-spacing:-.02em;
color:var(--forest);
margin-bottom:16px
}
.hero-tagline{font-size:18px;line-height:1.6;color:var(--slate);max-width:680px;margin:8px auto 24px}

.chat-wrapper{max-width:560px;margin:0 auto;background:#ECE5DD;border-radius:24px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.15)}
.chat-header{background:#075E54;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.chat-avatar{width:40px;height:40px;background:var(--cream);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-weight:600;color:var(--forest);font-size:18px}
.chat-messages{height:440px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px;background:#ECE5DD}
.chat-bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4;word-wrap:break-word;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chat-bubble-user{align-self:flex-end;background:#DCF8C6;border-bottom-right-radius:4px}
.chat-bubble-claire{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
</style>
</head>
<body>

<nav style="position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(245,240,232,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(31,61,53,.1);padding:18px 0">
<div class="container" style="display:flex;justify-content:space-between;align-items:center">
<a href="/" class="logo" style="font-family:var(--serif);font-size:26px;font-weight:600;color:var(--forest);display:flex;align-items:center;gap:10px">
<span style="background:var(--forest);color:var(--cream);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:italic">C</span>
Claire
</a>
</div>
</nav>

<section class="hero">
<div class="container">
<h1>Vos patients appellent quand vous êtes fermé ?</h1>
<p class="hero-tagline">Claire répond aux patients 24h/24 et 7j/7. Elle qualifie les demandes et transmet uniquement ce qui est important au cabinet.</p>
</div>
</section>

</div>
</div>
<div class="chat-messages" id="chatMessages"></div>
